<?xml version="1.0"?>
<xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="1.0">
<xsl:template match="/">
<html>


<head>
<!-- <meta charset="utf-8">-->
    <title>Сезоны </title>
   <style type="text/css">
                    body {max-width:297mm;}
                    table { 
                        border-collapse: collapse; table-layout: auto;
                    }
                    td {
                        height: 14;
                    }
                    .num {
                        text-align: right;
                    }
                    .vis-border {
                        border: 1px solid black;
                    }
                    .mytable{width: 100%; font-size:12px; }
                    .mytable2{width: 100%; font-size:12px; border: 1px solid black; }
                    .shapka2{ font-weight:900;
                    border: 1px solid black;    border-spacing: 0;    border-collapse: collapse; display: table-header-group;}
                    .shapka{ font-weight:900;
                    border: 1px solid black;    border-spacing: 0;    border-collapse: collapse; display: table-header-group;}
                    
                    tr {
                    page-break-inside: avoid;
                    }
                    
                </style>
                

</head>
<body>
<xsl:for-each select="/rep/card">
<table  class="mytable">
             <thead>
               <tr>
                  <td align="center" width="100%"> Список сезонов.</td>
               </tr>
            </thead>
</table>

<table  class="mytable">
             <thead>
               <tr>
                  <td align="left" width="100%"> <xsl:value-of select="@time" /></td>
               </tr>
            </thead>
</table>





<table class="mytable2">
            
    <thead class="shapka">
    <tr>
      <td align="right" class="vis-border" width="20%"> Код </td>   
      <td  align="left" class="vis-border" width="10%"> с </td>
	  <td  align="left" class="vis-border" width="10%"> по </td>
	  <td align="left" class="vis-border" width="40%"> Название </td> 
	  <td  align="left" class="vis-border" width="10%"> Объект </td>
	  <td  align="right" class="vis-border" width="10%"> БД </td>
    </tr>
	</thead>
	<tbody>
	<xsl:for-each select="./line">
	 <tr>
      <td align="right" class="vis-border" width="20%"> <xsl:value-of select="@sea-code" /> </td>   
      <td  align="left" class="vis-border" width="10%"> <xsl:value-of select="@sea-month-1" />  </td>
	  <td  align="left" class="vis-border" width="10%"> <xsl:value-of select="@sea-month-2" /> </td>
	  <td align="left" class="vis-border" width="40%"> <xsl:value-of select="@sea-name" /> </td> 
	  <td  align="left" class="vis-border" width="10%"> <xsl:value-of select="@attr-value" /> </td>
	  <td  align="right" class="vis-border" width="10%"> <xsl:value-of select="@db-num" /> </td>
    </tr>
	</xsl:for-each>
	
	
    </tbody>

       
</table> 

</xsl:for-each>

</body>
</html>
</xsl:template>
</xsl:stylesheet>
