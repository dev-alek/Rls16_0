<?xml version="1.0"?>
<xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform" version="1.0">
<xsl:template match="/">
<html>
    <head>
        <!-- <meta charset="utf-8">-->
        <title> </title>
        <style type="text/css">
        body {
            max-width:297mm;
        }
        table {
            border-collapse: collapse;
            table-layout: auto;
        }
        td {
            height: 14;
        }
        .num {
            text-align: right;
        }
        .vis-border {
            border: 1px solid black;
        }
        .mytable {
            width: 100%;
            font-size:12px;
        }
        .mytable2 {
            width: 100%;
            font-size:12px;
            border: 1px solid black;
        }
        .shapka {
            border: 1px solid black;
            border-spacing: 0;
            border-collapse: collapse;
            display: table-header-group;
        }
        tr {
            page-break-inside: avoid;
        }
        span {
            width: 100%;
        }
        </style>
    </head>
    <body>
        <xsl:for-each select="/rep">
<table class="mytable2">
            <thead class="shapka">
                <tr>
                    <td align="center" class="vis-border" width="auto"> Наименование </td>
                    <td align="center" class="vis-border" width="20%"> Цена за изж.<br>(РУБ)</br> </td>
                </tr>
            </thead>
            <tbody>
                <xsl:for-each select="./line">
                <tr>
                    <td align="left" class="vis-border" width="auto">  <xsl:value-of select="@gds-name"/></td>
                    <td align="center"  class="vis-border" width="20%"> <xsl:value-of select="@reason"/></td>
                </tr>
                </xsl:for-each>
            </tbody>
        </table>
 
        </xsl:for-each>
    </body>
</html>
</xsl:template>
</xsl:stylesheet>
